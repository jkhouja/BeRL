pipeline:
  output_dir: "data"
  output_name: "conversations_gone_awry_eval_prompt"
  seed: 42
  shuffle: true

perplexity:
  enabled: true
  model_name: "Qwen/Qwen2.5-3B-Instruct"
  batch_size: 2

datasets:
  - source: "conversations_gone_awry"
    split: "train"
    sample_size: null
    min_turns: 6
    min_response_words: 10
    prompt_style: "cot_tom"
    system_prompt_style: "cot_eval"
    generation_prefix: "<think>"
    add_response_tags: true
    include_system_in_prompt: true
    multi_sample: true
    turn_order: "random"
