pipeline:
  output_dir: "data"
  output_name: "merged_dialogue_datasets_16k_tom_prompt_filtered"
  seed: 42
  shuffle: true

perplexity:
  enabled: true
  model_name: "Qwen/Qwen2.5-3B-Instruct"
  batch_size: 8

datasets:
  - source: "dailydialog"
    split: "train"
    sample_size: 12000
    min_turns: 6
    min_response_words: 10
    prompt_style: "cot_tom"
    system_prompt_style: "cot_tom"
    generation_prefix: "<think>"
    add_response_tags: true
    include_system_in_prompt: true

  - source: "empathetic_dialogues"
    split: "train"
    sample_size: 12000
    min_turns: 6
    min_response_words: 10
    prompt_style: "cot_tom"
    system_prompt_style: "cot_tom"
    generation_prefix: "<think>"
    add_response_tags: true
    include_system_in_prompt: true
