extends: dcfg_base.yaml

# "Everything" mix: all dialogue sources at common data-gen params
# (dcfg_base defaults). Per-source sample caps balance the mixture; the base
# min/max response-word filters apply uniformly.
pipeline:
  output_name: "dcfg_mix_all"

datasets:
  - source: "dailydialog"
    sample_size: 4000
  - source: "empathetic_dialogues"
    sample_size: 4000
  - source: "conversations_gone_awry"
    sample_size: 4000
  - source: "casino"
    min_response_words: 1   # negotiation: short utterances (e.g. "Deal!")
    sample_size: 3000
  - source: "craigslist_bargain"
    min_response_words: 1   # negotiation: short utterances (e.g. "Deal!")
    sample_size: 3000
  - source: "dealornodeal"
    min_response_words: 1   # negotiation: short utterances (e.g. "Deal!")
    sample_size: 3000
  - source: "persuasionforgood"
    sample_size: 3000
  - source: "diplomacy"
    sample_size: 2000
  - source: "thoughttrace"
    sample_size: 3000
    target_speaker: "user"
