pipeline:
  output_dir: "data"
  output_name: "merged_dialogue_datasets_16k_latefirst"
  seed: 42
  shuffle: false  # preserve the late_first ordering

perplexity:
  enabled: false

datasets:
  - source: "dailydialog"
    split: "train"
    sample_size: 8000
    min_turns: 4
    min_response_words: 5
    prompt_style: "cot"
    system_prompt_style: "cot"
    generation_prefix: "<think>"
    add_response_tags: true
    include_system_in_prompt: true
    turn_order: "late_first"

  - source: "empathetic_dialogues"
    split: "train"
    sample_size: 8000
    min_turns: 4
    min_response_words: 5
    prompt_style: "cot"
    system_prompt_style: "cot"
    generation_prefix: "<think>"
    add_response_tags: true
    include_system_in_prompt: true
    turn_order: "late_first"
