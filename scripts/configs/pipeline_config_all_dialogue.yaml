pipeline:
  output_dir: "data"
  output_name: "merged_all_dialogue_eval_prompt"
  seed: 42
  shuffle: true

perplexity:
  enabled: true
  model_name: "Qwen/Qwen2.5-3B-Instruct"
  # batch_size=2 keeps the lm_head logits buffer small enough for the long
  # ThoughtTrace contexts (long AI turns) to avoid CUDA OOM.
  batch_size: 2

# "Everything" merge: all dialogue sources. cot_eval system prompt for ToM
# transfer. Per-dataset filters tuned to each source's utterance length:
# negotiation sets allow short utterances; long-form sets are capped.
datasets:
  # --- conversational / empathetic (low-medium ToM signal) ---
  - source: "dailydialog"
    sample_size: 4000
    min_turns: 6
    min_response_words: 10
    max_response_words: 150
    prompt_style: "cot_tom"
    system_prompt_style: "cot_eval"
    generation_prefix: "<think>"
    add_response_tags: true
    include_system_in_prompt: true
    multi_sample: true
    turn_order: "random"

  - source: "empathetic_dialogues"
    sample_size: 4000
    min_turns: 4
    min_response_words: 10
    max_response_words: 150
    prompt_style: "cot_tom"
    system_prompt_style: "cot_eval"
    generation_prefix: "<think>"
    add_response_tags: true
    include_system_in_prompt: true
    multi_sample: true
    turn_order: "random"

  # --- conflict / multi-party (high signal) ---
  - source: "conversations_gone_awry"
    sample_size: 4000
    min_turns: 6
    min_response_words: 10
    max_response_words: 200
    prompt_style: "cot_tom"
    system_prompt_style: "cot_eval"
    generation_prefix: "<think>"
    add_response_tags: true
    include_system_in_prompt: true
    multi_sample: true
    turn_order: "random"

  # --- negotiation (high ToM signal; short utterances) ---
  - source: "casino"
    sample_size: 3000
    min_turns: 6
    min_response_words: 1
    max_response_words: 120
    prompt_style: "cot_tom"
    system_prompt_style: "cot_eval"
    generation_prefix: "<think>"
    add_response_tags: true
    include_system_in_prompt: true
    multi_sample: true
    turn_order: "random"

  - source: "craigslist_bargain"
    sample_size: 3000
    min_turns: 6
    min_response_words: 1
    max_response_words: 120
    prompt_style: "cot_tom"
    system_prompt_style: "cot_eval"
    generation_prefix: "<think>"
    add_response_tags: true
    include_system_in_prompt: true
    multi_sample: true
    turn_order: "random"

  - source: "dealornodeal"
    sample_size: 3000
    min_turns: 6
    min_response_words: 1
    max_response_words: 120
    prompt_style: "cot_tom"
    system_prompt_style: "cot_eval"
    generation_prefix: "<think>"
    add_response_tags: true
    include_system_in_prompt: true
    multi_sample: true
    turn_order: "random"

  - source: "persuasionforgood"
    sample_size: 3000
    min_turns: 6
    min_response_words: 5
    max_response_words: 120
    prompt_style: "cot_tom"
    system_prompt_style: "cot_eval"
    generation_prefix: "<think>"
    add_response_tags: true
    include_system_in_prompt: true
    multi_sample: true
    turn_order: "random"

  - source: "diplomacy"
    sample_size: 2000
    min_turns: 6
    min_response_words: 5
    max_response_words: 150
    prompt_style: "cot_tom"
    system_prompt_style: "cot_eval"
    generation_prefix: "<think>"
    add_response_tags: true
    include_system_in_prompt: true
    multi_sample: true
    turn_order: "random"

  # --- long-form (cap utterance length) ---
  - source: "thoughttrace"
    sample_size: 3000
    min_turns: 6
    min_response_words: 10
    max_response_words: 120
    prompt_style: "cot_tom"
    system_prompt_style: "cot_eval"
    generation_prefix: "<think>"
    add_response_tags: true
    include_system_in_prompt: true
    multi_sample: true
    turn_order: "random"
    # Human–AI: AI turns are very long (~231 w); only predict the human's
    # (user) turns so long assistant context doesn't reject the conversation.
    target_speaker: "user"
